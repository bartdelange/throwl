name: Setup action jobs
description: Install the pinned Node, pnpm, Ruby, and optional Bundler dependencies

inputs:
  bundle:
    type: boolean
    required: true

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10.24.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        check-latest: true
        cache: 'pnpm'
        cache-dependency-path: |
          package.json
          pnpm-lock.yaml

    - name: Cache node_modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: node_modules-cache
      with:
        path: |
          **/node_modules
        key: NM-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}

    - name: Install dependencies
      shell: bash
      if: steps.node_modules-cache.outputs.cache-hit != 'true'
      run: pnpm install --frozen-lockfile

    - name: Set up Ruby
      if: ${{ inputs.bundle == 'true' }}
      uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
      with:
        working-directory: apps/throwl
        bundler-cache: true
