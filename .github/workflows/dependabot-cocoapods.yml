name: Verify CocoaPods lockfile

on:
  pull_request:
    branches: [master]
    paths:
      - 'pnpm-lock.yaml'
      - 'apps/throwl/Gemfile.lock'
      - 'apps/throwl/ios/Podfile'
      - 'apps/throwl/ios/Podfile.lock'

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/reusable-setup/
        with:
          os: macos-latest
          bundle: true
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: apps/throwl/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/throwl/ios/Podfile.lock') }}
      - name: Verify locked pods install reproducibly
        working-directory: apps/throwl/ios
        run: bundle exec pod install --deployment
