name: Distribute app to Android & iOS stores 🚀

on:
  push:
    branches: [master]
    paths:
      - 'apps/throwl/**'
      - 'libs/**'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/workflows/release-throwl.yaml'
      - '.github/workflows/reusable-deploy.yaml'
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-*.yaml'
      - 'nx.json'
      - 'tsconfig*.json'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'What to deploy'
        default: 'both'
        type: choice
        required: false
        options: [ios, android, both]
      publish:
        description: Upload the signed builds to the stores
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref_type == 'branch' && 'master-native-build' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  validate:
    if: github.event_name != 'release' || (!github.event.release.prerelease && !github.event.repository.fork)
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.release.outputs.notes }}
      version: ${{ steps.release.outputs.version }}
      ios_build: ${{ steps.release.outputs.ios_build }}
      android_build: ${{ steps.release.outputs.android_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'release' && '0' || '1' }}

      - name: Validate published release notes and build versions
        id: release
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Enter a version tag such as v5.1.2.'; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          notes=$(jq -ce '[
            .release.body | match("<!-- throwl-store-notes -->\\s*```json\\r?\\n([\\s\\S]*?)\\r?\\n```"; "g") | .captures[0].string
          ] | if length == 1 then .[0] | fromjson else error("Keep one store-notes JSON block in the GitHub release") end
            | if .["en-US"] and all(to_entries[];
                (.key | test("^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$")) and
                (.value.whatsNew | type == "string" and test("\\S") and length <= 500) and
                (.value | if has("iosPromotionalText") then
                  .iosPromotionalText | type == "string" and length <= 170
                else true end))
              then . else error("Fill in the store notes and check the locale and text lengths") end' \
            "$GITHUB_EVENT_PATH")

          version=$(jq -er .version apps/throwl/package.json)
          gradle=apps/throwl/android/app/build.gradle
          xcode=apps/throwl/ios/Throwl.xcodeproj/project.pbxproj
          android_build=$(awk '$1 == "versionCode" { print $2 }' "$gradle")
          ios_build=$(awk '$1 == "CURRENT_PROJECT_VERSION" { gsub(/;/, "", $3); print $3 }' "$xcode" | sort -u)
          android_version=$(awk '$1 == "versionName" { gsub(/"/, "", $2); print $2 }' "$gradle")
          ios_version=$(awk '$1 == "MARKETING_VERSION" { gsub(/;/, "", $3); print $3 }' "$xcode" | sort -u)
          [[ "$RELEASE_TAG" == "v$version" && "$android_version" == "$version" && "$ios_version" == "$version" ]]
          [[ "$android_build" =~ ^[0-9]+$ && "$ios_build" =~ ^[0-9]+$ ]]
          {
            printf 'notes=%s\n' "$notes"
            echo "version=$version"
            echo "ios_build=$ios_build"
            echo "android_build=$android_build"
          } >> "$GITHUB_OUTPUT"

      - name: Setup directory and install required packages
        uses: ./.github/actions/reusable-setup/
        with:
          bundle: false

      - name: Use Java 21 for Firebase Emulator
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Lint
        run: pnpm lint:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Firestore Security Rules
        run: pnpm test:firestore-rules

  deploy_android:
    name: Continuous Deployment (Android)
    needs: validate
    uses: ./.github/workflows/reusable-deploy.yaml
    if: ${{ !github.event.repository.fork && (github.event_name != 'workflow_dispatch' || inputs.deploy == 'both' || inputs.deploy == 'android') }}
    permissions:
      contents: read
    with:
      # Pin the runner image for reproducible Android release builds.
      os: ubuntu-24.04
      working_directory: apps/throwl/android
      store: Google Play Store
      publish: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    secrets:
      RELEASE_ARTIFACT_KEY: ${{ secrets.RELEASE_ARTIFACT_KEY }}
      ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
      ANDROID_KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
      ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}
      ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}

  deploy_ios:
    name: Continuous Deployment (iOS)
    needs: validate
    uses: ./.github/workflows/reusable-deploy.yaml
    if: ${{ !github.event.repository.fork && (github.event_name != 'workflow_dispatch' || inputs.deploy == 'both' || inputs.deploy == 'ios') }}
    permissions:
      contents: read
    with:
      os: xcode-27
      working_directory: apps/throwl/ios
      store: TestFlight
      publish: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    secrets:
      RELEASE_ARTIFACT_KEY: ${{ secrets.RELEASE_ARTIFACT_KEY }}
      IOS_APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
      IOS_DEVELOPER_APP_ID: ${{ secrets.DEVELOPER_APP_ID }}
      IOS_DEVELOPER_APP_IDENTIFIER: ${{ secrets.DEVELOPER_APP_IDENTIFIER }}
      IOS_DEVELOPER_PORTAL_TEAM_ID: ${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}
      IOS_FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
      IOS_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      IOS_MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      IOS_APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      IOS_APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
      IOS_APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
      IOS_GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_B64 }}

  prepare:
    name: Submit both tested builds for store review
    needs: [validate, deploy_android, deploy_ios]
    if: github.event_name == 'release'
    concurrency:
      group: throwl-production-store-preparation
      cancel-in-progress: false
    runs-on: macos-latest
    environment: store-review
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1 # v7.0.1

      - name: Require recorded store-review approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            | jq -e 'any(.[]; .state == "approved" and any(.environments[]; .name == "store-review"))' >/dev/null || {
              echo 'Configure required reviewers for the store-review environment and approve this run before preparing the stores.'
              exit 1
            }

      - name: Save validated notes for Fastlane
        env:
          STORE_NOTES: ${{ needs.validate.outputs.notes }}
        run: printf '%s\n' "$STORE_NOTES" > "$RUNNER_TEMP/store-notes.json"

      - name: Set up Ruby
        uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          working-directory: apps/throwl
          bundler-cache: true

      - name: Submit tested iOS build to App Review
        id: ios
        continue-on-error: true
        working-directory: apps/throwl
        run: bundle exec fastlane ios submit_tested_build "version:$VERSION" "build:$BUILD_NUMBER" "notes:$RUNNER_TEMP/store-notes.json"
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.ios_build }}
          DEVELOPER_APP_IDENTIFIER: ${{ secrets.DEVELOPER_APP_IDENTIFIER }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}

      - name: Submit tested Android build for production review
        id: android
        continue-on-error: true
        working-directory: apps/throwl
        run: bundle exec fastlane android submit_tested_build "build:$BUILD_NUMBER" "notes:$RUNNER_TEMP/store-notes.json"
        env:
          BUILD_NUMBER: ${{ needs.validate.outputs.android_build }}
          PLAY_CONFIG_JSON: ${{ secrets.PLAY_CONFIG_JSON }}

      - name: Report store submission results
        env:
          IOS_OUTCOME: ${{ steps.ios.outcome }}
          ANDROID_OUTCOME: ${{ steps.android.outcome }}
        run: |
          printf '### Store submission\n\n- iOS: %s\n- Android: %s\n' "$IOS_OUTCOME" "$ANDROID_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          [[ "$IOS_OUTCOME" == success && "$ANDROID_OUTCOME" == success ]]
